apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: diki-scanner
  labels:
{{ include "labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scanner.diki.gardener.cloud
subjects:
- kind: ServiceAccount
  name: diki-run
  namespace: {{ include "diki-runner.namespace" . }}
